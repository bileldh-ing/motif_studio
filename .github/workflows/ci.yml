name: CI
on:
  push:
    branches: [main, "phase*", "release/*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  PNPM_VERSION: 10.14.0
  NODE_VERSION: 22

jobs:
  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @motif/api typecheck
      - run: pnpm --filter @motif/desktop typecheck
      - run: pnpm --filter @motif/web typecheck

  test:
    name: Unit, render & API tests (Debian trixie, FFmpeg 7.1, PostgreSQL 17)
    runs-on: ubuntu-24.04
    container: debian:trixie
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: motif_test }
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/motif_test
      MOTIF_PYTHON: /opt/venv/bin/python
      HF_HOME: /github/home/.cache/hf
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core python3-venv ca-certificates git curl xz-utils unzip jq
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Whisper (local AI captions)
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --quiet faster-whisper
      - uses: actions/cache@v4
        with: { path: /github/home/.cache/hf, key: hf-whisper-tiny-v1 }
      - run: pnpm install --frozen-lockfile
      - run: ffmpeg -version | head -1
      - name: Core + render engine + effects + API + sync tests
        run: pnpm exec vitest run --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results }

  web:
    name: Web app build (Next.js static export)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @motif/web build
        env: { NEXT_PUBLIC_API_URL: "https://api.motif.studio" }
      - uses: actions/upload-artifact@v4
        with: { name: web-static, path: apps/web/out }

  api-image:
    name: API container (build + boot against PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t motif-api:ci .
      - name: Boot and probe readiness
        run: |
          docker network create motif
          docker run -d --name db --network motif -e POSTGRES_PASSWORD=motif -e POSTGRES_USER=motif -e POSTGRES_DB=motif postgres:17
          for i in $(seq 30); do docker exec db pg_isready -U motif && break; sleep 2; done
          docker run -d --name api --network motif -p 8787:8787 -e DATABASE_URL=postgres://motif:motif@db:5432/motif -e STORAGE_SIGNING_SECRET=ci-secret motif-api:ci
          for i in $(seq 30); do curl -fsS localhost:8787/readyz && break; sleep 2; done
          curl -fsS localhost:8787/readyz | jq -e '.ok'
          curl -fsS -X POST localhost:8787/v1/auth/signup -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-password-123"}' | jq -e '.token'
          docker logs api | tail -20

  smoke:
    name: Desktop UI smoke test (Electron under Xvfb)
    runs-on: ubuntu-24.04
    container: debian:trixie
    needs: [typecheck]
    env:
      MOTIF_PYTHON: /opt/venv/bin/python
      HF_HOME: /github/home/.cache/hf
      ELECTRON_DISABLE_SANDBOX: "1"
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core python3-venv ca-certificates git curl xz-utils jq \
            xvfb xauth libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxkbcommon0 libcups2t64 libdrm2 libxdamage1 libxrandr2 libxcomposite1 libpango-1.0-0 libcairo2
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: python3 -m venv /opt/venv && /opt/venv/bin/pip install --quiet faster-whisper
      - uses: actions/cache@v4
        with: { path: /github/home/.cache/hf, key: hf-whisper-tiny-v1 }
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
        working-directory: apps/desktop
      - name: Build & run smoke test
        working-directory: apps/desktop
        run: |
          pnpm exec electron-vite build
          MOTIF_SMOKE_DIR=$GITHUB_WORKSPACE/tests/output/smoke xvfb-run -a -s "-screen 0 1600x1000x24" node_modules/electron/dist/electron . --no-sandbox --disable-gpu --disable-dev-shm-usage
      - name: All smoke checks passed
        run: jq -e 'all(.[]; .ok)' tests/output/smoke/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-screenshots, path: tests/output/smoke }

  package:
    name: Package ${{ matrix.os }}
    needs: [test, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --linux AppImage deb --x64
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-14
            args: --mac dmg zip --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-ffmpeg.mjs
      - name: Build unsigned installers
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MS_STORE_IDENTITY_NAME: MOTIFStudio.Dev
          MS_STORE_PUBLISHER: CN=MOTIF Studio Dev
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder ${{ matrix.args }} --publish never
      - name: Installer smoke (launch packaged app, Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/release
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libfuse2t64 || sudo apt-get install -y xvfb libfuse2
          APP=$(ls *.AppImage | head -1); chmod +x "$APP"
          ./"$APP" --appimage-extract >/dev/null
          set +e
          timeout 25 xvfb-run -a ./squashfs-root/motif-studio --no-sandbox --disable-gpu > launch.log 2>&1
          code=$?
          tail -20 launch.log
          # 124 = still running when the timeout hit, i.e. the packaged app started and stayed up
          [ $code -eq 124 ] || (echo "packaged app exited early with $code" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
