name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @motif/desktop typecheck
      - run: pnpm test
      - run: MOTIF_SMOKE_DIR=$PWD/tests/output/smoke pnpm --filter @motif/desktop smoke
      - run: jq -e 'all(.[]; .ok)' tests/output/smoke/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: tests/output/smoke }
