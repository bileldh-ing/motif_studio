<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta

      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: motif-media:; media-src 'self' blob: motif-media:; connect-src 'self' motif-media: ws://localhost:*; font-src 'self' data:"

@font-face { font-family: "MotifMono"; src: url("fonts/DejaVuSansMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
